<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LobbyCard-Assistent – Jusos Ulm</title>
  <meta name="description" content="Hilfe beim Antrag auf LobbyCard und KinderBonusCard der Stadt Ulm – in 7 Sprachen. Ein Angebot der Jusos Ulm.">
  <meta name="theme-color" content="#E0001B">
  <link rel="icon" type="image/png" href="logo-header.png">
  <link rel="stylesheet" href="app.css">
  <script src="config.js" defer></script>
  <script src="texte.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <img src="logo-header.png" alt="Jusos Ulm" width="511" height="328">
        <span class="brand-title" id="brand-title">LobbyCard-Assistent</span>
      </div>
      <div class="lang-picker" id="lang-picker" hidden>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5c2.6 2.7 3.9 5.9 3.9 9.5s-1.3 6.8-3.9 9.5c-2.6-2.7-3.9-5.9-3.9-9.5S9.4 5.2 12 2.5z"/></svg>
        <select id="lang-select" aria-label="Sprache"></select>
      </div>
      <button type="button" class="help-btn" data-action="open-help">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M9.3 9.3a2.8 2.8 0 0 1 5.5.9c0 1.9-2.8 2.3-2.8 4.1"/><circle cx="12" cy="17.4" r=".7" fill="currentColor"/></svg>
        <span id="help-label">Hilfe</span>
      </button>
    </div>
    <div class="progress" aria-hidden="true"><div class="progress-bar" id="progress-bar"></div></div>
  </header>

  <main>
    <div class="card">
      <div class="step" id="step">
        <noscript><p>Bitte aktiviere JavaScript, um den Assistenten zu nutzen. · Please enable JavaScript to use this assistant.</p></noscript>
      </div>
      <nav class="step-nav" id="step-nav" hidden>
        <button type="button" class="btn btn-ghost" id="btn-back" data-action="back"></button>
        <button type="button" class="btn btn-primary" id="btn-next" data-action="next"></button>
      </nav>
    </div>
  </main>

  <footer class="footer" id="footer"></footer>

  <dialog class="help" id="help-dialog" aria-labelledby="help-title">
    <div class="dialog-head">
      <h2 id="help-title">Hilfe</h2>
      <button type="button" class="icon-btn" id="help-close" data-action="close-help" aria-label="Schließen">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="dialog-body" id="help-body"></div>
  </dialog>
</body>
</html>
